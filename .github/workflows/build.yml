name: Build

on:
    push:
        branches:
            - "master"
        tags:
            - '*'
        paths-ignore:
            - README.md 
    pull_request:
        branches:
            - "master"
        paths-ignore:
            - README.md

env:
    TOOLKIT_NET_VERSION: '10.0.100'
    LATEST_NET_VERSION: '10.0.x'
    PathToLibrarySolution: 'src/MauiFullScreen.slnx'
    PathToSampleSolution: 'samples/MauiFullScreen.Sample.slnx'
    PathToMauiFullScreenSampleCsproj: 'samples/MauiFullScreen.Sample/MauiFullScreen.Sample.csproj'
    PathToMauiFullScreenTestsCsproj: 'src/MauiFullScreen.Tests/MauiFullScreen.Tests.csproj'
    PathToMauiFullScreenCsproj: 'src/MauiFullScreen/MauiFullScreen.csproj'
    MauiFullScreenLibrary_Xcode_Version: '26.1'
    MauiFullScreenSample_Xcode_Version: '^26'

jobs:
    build_sample:
        name: Build Sample App using Latest .NET SDK
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ windows-latest, macos-26 ]
    
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
        
            -   name: Set Latest Xcode Version
                if: runner.os == 'macOS'
                uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: ${{ env.MauiFullScreenSample_Xcode_Version }}
        
            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'
                
            -   uses: actions/setup-java@v5
                with:
                    distribution: 'microsoft'
                    java-version: '21'
        
            -   name: Install .NET MAUI Workload
                run: |
                    dotnet workload install maui
                    dotnet workload update

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Build Maui FullScreen Sample
                run: dotnet build -c Release ${{ env.PathToMauiFullScreenSampleCsproj }}
        
    build_library:
        name: Build Library
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ windows-latest, macos-26 ]
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Set Xcode Version
                if: runner.os == 'macOS'
                uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: ${{ env.MauiFullScreenLibrary_Xcode_Version }}

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   uses: actions/setup-java@v5
                with:
                    distribution: 'microsoft'
                    java-version: '17'

            -   name: Install .NET MAUI Workload
                run: |
                    dotnet workload install maui
                    dotnet workload update

            -   name: Display dotnet info
                run: dotnet --info

            -   name: 'Build MauiFullScreen Library'
                run: dotnet build ${{ env.PathToMauiFullScreenCsproj }} -c Release

    publish_nuget:
        name: Publish to NuGet
        needs: build_library
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ windows-latest, macos-26 ]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Install .NET MAUI Workload
                run: |
                    dotnet workload install maui
                    dotnet workload update
                    
            -   name: Pack MauiFullScreen
                run: dotnet pack ${{ env.PathToMauiFullScreenCsproj }} -c Release -o ./artifacts

            -   name: Publish to NuGet
                run: dotnet nuget push ./artifacts/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate